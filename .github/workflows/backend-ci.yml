name: backend-ci

on:
  push:
    paths:
      - "dev/backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "dev/backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: dev/backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
