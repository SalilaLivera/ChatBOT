# MaternaLink — Phase C1 stack: backend + fer + sentiment + postgres.
#
# `fusion` is a commented-out placeholder ONLY — dev/fusion-service/ does not
# exist yet, it is built in C4. A live entry here would break `docker compose
# up`, which is itself a C1 exit criterion (C1_PLAN.md §3, deviation D-1).
#
# All configuration comes from an untracked .env (see .env.example). No
# secret and no fusion parameter appears in this file.

services:
  backend:
    build:
      context: ./dev/backend
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      fer:
        condition: service_healthy
      sentiment:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  fer:
    build:
      context: .
      dockerfile: docker/fer.Dockerfile
    environment:
      FER_DEBUG: ${FER_DEBUG:-0}
    ports:
      - "7860:7860"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      # FER inference is sub-millisecond (MEASURED, nb07) but interpreter +
      # dependency load is unmeasured; a short grace is a reasonable estimate.
      start_period: 20s

  sentiment:
    build:
      context: .
      dockerfile: docker/sentiment.Dockerfile
    environment:
      SENTIMENT_DEBUG: ${SENTIMENT_DEBUG:-0}
    ports:
      # Host 8000 may be occupied by unrelated local projects; container port
      # is unaffected — cross-container calls use http://sentiment:8000.
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      # PROVISIONAL — sentiment cold start (254 MB checkpoint + torch load) is
      # UNKNOWN (handoff §13, plan §7A.9). This grace is a generous guess to
      # avoid killing the container mid-load; it is set for real in C8.3.
      start_period: 120s

  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    # No volume — C1 defines no persistence yet (migrations land in C7). No
    # bind mount or tmpfs anywhere a face image could be written (§7A.8).

  # fusion:
  #   Placeholder only. dev/fusion-service/ is built in C4 — the compose
  #   service is added then, wrapping dev/fusion/ (the pure-Python library)
  #   behind the HTTP contract described in BACKEND_IMPLEMENTATION_PLAN.md §4.
  #   Fusion parameters (W_face, W_text, tau_*) are injected at container
  #   start as environment variables, never baked into the image (§7A.7) —
  #   this compose file will never contain a fusion parameter literal.
